name: Morpheus Space
description: >-
  Morpheus Space is an in-space mobility company building electric propulsion
  systems and mission-design software for the New Space economy. Founded in 2018
  out of the Technical University of Dresden, its second-generation GO-2 system
  uses FEEP (Field Emission Electric Propulsion) technology to deliver
  continuous, chemical-free thrust for satellite constellation deployment,
  station keeping, collision avoidance, repositioning, and deorbiting. The
  company also offers Journey, a mission simulation and design platform that
  matches simulated requirements to available satellite subsystems. Morpheus
  Space markets ITAR-free solutions and is backed by investors including
  Techstars, Alpine Space Ventures, Airbus Ventures, Lavrock Ventures, and
  In-Q-Tel. The company publishes no public developer API; its only
  machine-facing surface is a platform-hosted (Wix) site MCP endpoint and an
  auto-generated llms.txt for agent access to public marketing content.
